    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Styky" />
    <meta property="og:title" content="Styky: reminders you control from Claude, your terminal and git hooks" />
    <meta
      property="og:description"
      content="A free, open-source Windows reminder widget with a CLI and MCP server. Ctrl+Alt+N quick add, native notifications, local-first."

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Styky",
        "operatingSystem": "Windows 10, Windows 11",
        "applicationCategory": "ProductivityApplication",
        "description": "A Windows reminder widget with natural-language quick add, native notifications, and a local CLI and MCP server for Claude and the terminal.",
        "url": "__SITE_URL__",
        "license": "https://opensource.org/license/mit",
        "author": { "@type": "Person", "name": "Omor Shahriar" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <script>
      /* Set the theme before first paint (no flash): saved choice, else the system preference. */
      (function () {
        var t;
        try {
          t = localStorage.getItem("styky-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font:16px system-ui;padding:2rem;max-width:40rem;margin:auto">
        Styky is a Windows reminder widget you control from Claude, your terminal and git hooks.
        <a href="https://github.com/omorShahriar/styky/releases/latest">Download it from GitHub</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
