<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="__SITE_URL__" />
    <link rel="icon" type="image/svg+xml" href="__BASE__favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Styky" />
    <meta property="og:title" content="Styky: reminders you can't afford to forget" />
    <meta
      property="og:description"
      content="A glassy Windows 11 desktop reminder widget. Type it like you say it, get a native nudge on time. Local-first and open source."
    />
    <meta property="og:url" content="__SITE_URL__" />
    <meta property="og:image" content="__SITE_URL__og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Styky reminder panel on a Windows 11 desktop" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Styky: reminders you can't afford to forget" />
    <meta
      name="twitter:description"
      content="A glassy Windows 11 desktop reminder widget. Type it like you say it, get a native nudge on time."
    />
    <meta name="twitter:image" content="__SITE_URL__og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Styky",
        "operatingSystem": "Windows 10, Windows 11",
        "applicationCategory": "ProductivityApplication",
        "description": "A glassy Windows 11 desktop reminder widget with natural-language quick add and native notifications.",
        "url": "__SITE_URL__",
        "license": "https://opensource.org/license/mit",
        "author": { "@type": "Person", "name": "Omor Shahriar" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <script>
      /* Set the theme before first paint (no flash): saved choice, else the system preference. */
      (function () {
        var t;
        try {
          t = localStorage.getItem("styky-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font:16px system-ui;padding:2rem;max-width:40rem;margin:auto">
        Styky is a Windows desktop reminder widget.
        <a href="https://github.com/omorShahriar/styky/releases/latest">Download it from GitHub</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
