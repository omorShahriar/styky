<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__TITLE__</title>
    <meta name="description" content="__DESCRIPTION__" />
    <meta name="robots" content="max-image-preview:large" />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    __HEAD__

    __JSONLD__

    <noscript>
      <!-- The page is prerendered; this only undoes the scroll-reveal fade, which needs JavaScript to run. -->
      <style>
        .x-reveal {
          opacity: 1;
          transform: none;
        }
      </style>
    </noscript>

    <script>
      /* Set the theme before first paint (no flash): saved choice, else the system preference. */
      (function () {
        var t;
        try {
          t = localStorage.getItem("styky-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Channel tagging: rewrites hrefs only (no storage, cookies or network). Runs before React mounts, so any
         Microsoft Store link rendered by React needs the same logic in an effect. -->
    <script>
      (() => {
        const p = location.pathname.replace(/\/$/, "").slice(1);
        const known = ["sp", "w11", "mcp", "hn", "cai", "registry", "readme", "pro"];
        const tag = known.includes(p) ? "site-" + p : "site";
        const set = (sel, key) =>
          document.querySelectorAll(sel).forEach((a) => {
            const u = new URL(a.href);
            u.searchParams.set(key, tag);
            a.href = u.toString();
          });
        set("a[data-store]", "cid");
        set("a[data-buy]", "checkout[custom][src]");
      })();
    </script>
  </body>
</html>
