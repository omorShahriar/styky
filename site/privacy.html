<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Privacy | Styky</title>
    <meta name="description" content="No telemetry. Styky only goes online to check for updates and to activate or remove a Pro key when you click the button." />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="__SITE_URL__privacy" />
    <link rel="icon" type="image/svg+xml" href="__BASE__favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Styky" />
    <meta property="og:title" content="Privacy | Styky" />
    <meta property="og:description" content="No telemetry. Styky only goes online to check for updates and to activate or remove a Pro key when you click the button." />
    <meta property="og:url" content="__SITE_URL__privacy" />
    <meta property="og:image" content="__SITE_URL__og.png" />

    <script>
      /* Set the theme before first paint (no flash): saved choice, else the system preference. */
      (function () {
        var t;
        try {
          t = localStorage.getItem("styky-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body data-page="privacy">
    <div id="root"></div>
    <noscript>
      <p style="font:16px system-ui;padding:2rem;max-width:40rem;margin:auto">
        Privacy: see <a href="https://github.com/omorShahriar/styky">github.com/omorShahriar/styky</a> or write to
        <a href="mailto:hello@smallhingelabs.com">hello@smallhingelabs.com</a>.
      </p>
    </noscript>
    <script type="module" src="/src/legal.tsx"></script>
  </body>
</html>
