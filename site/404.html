<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__TITLE__</title>
    <meta name="robots" content="noindex" />
    <meta name="description" content="__DESCRIPTION__" />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    __HEAD__

    <script>
      /* Set the theme before first paint (no flash): saved choice, else the system preference. */
      (function () {
        var t;
        try {
          t = localStorage.getItem("styky-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body data-page="404">
    <div id="root"></div>
    <noscript>
      <p style="font:16px system-ui;padding:2rem;max-width:40rem;margin:auto">
        Page not found. <a href="/">Go to the Styky homepage</a>.
      </p>
    </noscript>
    <script type="module" src="/src/legal.tsx"></script>
  </body>
</html>
