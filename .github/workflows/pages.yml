name: Deploy website

# Builds site/ and publishes it to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      # the demo renders the app's real UI and parser straight from src/
      - "src/components/**"
      - "src/app/**"
      - "src/lib/**"
      - "src/styles/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install
        working-directory: site
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Build
        working-directory: site
        env:
          # Override for a custom domain: set repository variables SITE_BASE=/ and SITE_URL=https://styky.app/
          SITE_BASE: ${{ vars.SITE_BASE || '/styky/' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://omorshahriar.github.io/styky/' }}
          VITE_LS_CHECKOUT_URL: ${{ vars.LS_CHECKOUT_URL }}
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
